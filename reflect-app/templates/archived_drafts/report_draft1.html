<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflect — Content Quality Report</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 
                   'Segoe UI', sans-serif;
      background: #f5f0eb;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header .logo {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 42px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .header .overall-label {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 20px;
      background: #1a1a1a;
      color: white;
      border-radius: 20px;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header .overall-summary {
      margin-top: 16px;
      font-size: 16px;
      color: #555;
      line-height: 1.6;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Cards ── */
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .card-title {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }

    .card-headline {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-summary {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* ── Theme bars ── */
    .theme-bar {
      margin-bottom: 16px;
    }

    .theme-bar-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .theme-name {
      font-weight: 600;
      font-size: 15px;
    }

    .theme-meta {
      font-size: 13px;
      color: #888;
    }

    .theme-pct {
      font-weight: 700;
      font-size: 15px;
    }

    .bar-track {
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s ease;
    }

    .bar-fill.wellness   { background: #c084fc; }
    .bar-fill.finance    { background: #60a5fa; }
    .bar-fill.food       { background: #fb923c; }
    .bar-fill.fitness    { background: #34d399; }
    .bar-fill.politics   { background: #f87171; }
    .bar-fill.education  { background: #fbbf24; }
    .bar-fill.conspiracy { background: #ef4444; }
    .bar-fill.default    { background: #94a3b8; }

    /* ── Score circles ── */
    .scores-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .score-circle {
      text-align: center;
      padding: 20px 12px;
      background: #f8f8f8;
      border-radius: 12px;
    }

    .score-number {
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
    }

    .score-number.good  { color: #22c55e; }
    .score-number.mid   { color: #f59e0b; }
    .score-number.bad   { color: #ef4444; }

    .score-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* ── Breakdown pills ── */
    .breakdown {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    .pill.positive  { background: #dcfce7; color: #166534; }
    .pill.neutral   { background: #fef9c3; color: #854d0e; }
    .pill.negative  { background: #fee2e2; color: #991b1b; }
    .pill.unique    { background: #dbeafe; color: #1e40af; }
    .pill.repeated  { background: #fce7f3; color: #9d174d; }

    /* ── Key themes ── */
    .key-themes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .theme-tag {
      padding: 6px 14px;
      background: #f0f0f0;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: #444;
    }

    /* ── Print summary ── */
    .print-card {
      background: #1a1a1a;
      color: white;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }

    .print-card .card-title { color: #888; }
    .print-card .card-headline { color: white; }

    .print-lines {
      margin-top: 16px;
      border-top: 1px solid #333;
      padding-top: 16px;
    }

    .print-line {
      padding: 10px 0;
      border-bottom: 1px solid #333;
      font-size: 15px;
      color: #ccc;
      line-height: 1.5;
    }

    .print-recommendation {
      margin-top: 16px;
      padding: 16px;
      background: #2a2a2a;
      border-radius: 8px;
      font-size: 14px;
      color: #aaa;
      line-height: 1.6;
    }

    .print-recommendation strong {
      color: white;
      display: block;
      margin-bottom: 4px;
    }

    /* ── Persona switcher ── */
    .switcher {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .switcher button {
      padding: 10px 24px;
      border-radius: 20px;
      border: 2px solid #1a1a1a;
      background: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .switcher button.active,
    .switcher button:hover {
      background: #1a1a1a;
      color: white;
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 80px 20px;
      color: #888;
      font-size: 16px;
    }

    .divider {
      height: 1px;
      background: #f0f0f0;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="logo">Reflect</div>
      <h1>Content Quality Report</h1>
    </div>

    <!-- Persona switcher -->
    <div class="switcher">
      <button class="active" onclick="loadReport('diverse', this)">
        Diverse Consumer
      </button>
      <button onclick="loadReport('echo_chamber', this)">
        Echo Chamber User
      </button>
    </div>

    <!-- Report content -->
    <div id="report">
      <div class="loading">Analyzing your media diet...</div>
    </div>

  </div>

  <script>
    // ── Load report from API ──────────────────────────
    async function loadReport(persona, btn) {

      // Update active button
      document.querySelectorAll('.switcher button')
        .forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Show loading
      document.getElementById('report').innerHTML =
        '<div class="loading">Analyzing media diet...</div>';

      try {
        const response = await fetch(`/analyze?persona=${persona}`);
        const data = await response.json();
        renderReport(data);
      } catch (err) {
        document.getElementById('report').innerHTML =
          `<div class="loading">Error loading report: ${err}</div>`;
      }
    }

    // ── Render report ─────────────────────────────────
    function renderReport(data) {
      const user = data.user || {};
      const themes = data.thematic_analysis || {};
      const dims = data.dimensionality_analysis || {};
      const print = data.print_summary || {};
      const polarity = dims.polarity || {};
      const emotion = dims.emotional_tone || {};
      const echo = dims.echo_chamber || {};

      // ── Score color helper ─────────────────────────
      function scoreColor(score, invert = false) {
        const s = invert ? 11 - score : score;
        if (s >= 7) return 'good';
        if (s >= 4) return 'mid';
        return 'bad';
      }

      // ── Bar color helper ───────────────────────────
      function barColor(theme) {
        const map = {
          'wellness': 'wellness',
          'finance': 'finance',
          'food': 'food',
          'fitness': 'fitness',
          'politics': 'politics',
          'education': 'education',
          'conspiracy': 'conspiracy'
        };
        return map[theme.toLowerCase()] || 'default';
      }

      // ── Build themes HTML ──────────────────────────
      const themesHTML = (themes.themes || []).map(t => `
        <div class="theme-bar">
          <div class="theme-bar-header">
            <div>
              <span class="theme-name">${t.theme}</span>
              <span class="theme-meta">
                · ${t.consumption_type || ''} 
                · ${t.engagement_level || ''} engagement
              </span>
            </div>
            <span class="theme-pct">${t.percentage}%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill ${barColor(t.theme)}"
                 style="width: ${t.percentage}%"></div>
          </div>
        </div>
      `).join('');

      // ── Build key themes pills ─────────────────────
      const keyThemesHTML = (echo.key_themes || []).map(t =>
        `<span class="theme-tag">${t}</span>`
      ).join('');

      // ── Full report HTML ───────────────────────────
      document.getElementById('report').innerHTML = `

        <!-- User overview -->
        <div class="card">
          <div class="card-title">Your Overview</div>
          <div class="card-headline">
            Good morning, ${user.name || 'User'}
          </div>
          <div style="margin-top: 8px;">
            <span class="overall-label">
              ${user.overall_label || ''}
            </span>
          </div>
          <div class="card-summary" style="margin-top: 16px;">
            ${user.overall_summary || ''}
          </div>
        </div>

        <!-- Scores overview -->
        <div class="card">
          <div class="card-title">Dimension Scores</div>
          <div class="card-headline" style="font-size: 18px; 
               margin-bottom: 20px;">
            How your content scores across key dimensions
          </div>
          <div class="scores-grid">
            <div class="score-circle">
              <div class="score-number 
                   ${scoreColor(polarity.score || 5)}">
                ${polarity.score || '—'}/10
              </div>
              <div class="score-label">Polarity</div>
            </div>
            <div class="score-circle">
              <div class="score-number 
                   ${scoreColor(emotion.score || 5)}">
                ${emotion.score || '—'}/10
              </div>
              <div class="score-label">Emotional Tone</div>
            </div>
            <div class="score-circle">
              <div class="score-number 
                   ${scoreColor(echo.score || 5)}">
                ${echo.score || '—'}/10
              </div>
              <div class="score-label">Diversity</div>
            </div>
          </div>
        </div>

        <!-- Thematic analysis -->
        <div class="card">
          <div class="card-title">Thematic Analysis</div>
          <div class="card-headline">
            ${themes.dominant_theme || 'Content'} Dominant
          </div>
          <div class="card-summary">${themes.theme_summary || ''}</div>
          ${themesHTML}
          <div class="divider"></div>
          <div style="font-size: 13px; color: #888;">
            Based on ${themes.total_videos_analyzed || 0} videos analyzed
          </div>
        </div>

        <!-- Emotional tone -->
        <div class="card">
          <div class="card-title">Emotional Tone</div>
          <div class="card-headline">
            ${emotion.label || ''}
          </div>
          <div class="card-summary">${emotion.summary || ''}</div>
          <div class="breakdown">
            <div class="pill positive">
              Positive ${emotion.breakdown?.positive || 0}%
            </div>
            <div class="pill neutral">
              Neutral ${emotion.breakdown?.neutral || 0}%
            </div>
            <div class="pill negative">
              Polarizing ${emotion.breakdown?.polarizing || 0}%
            </div>
          </div>
        </div>

        <!-- Polarity -->
        <div class="card">
          <div class="card-title">Content Polarity</div>
          <div class="card-headline">${polarity.label || ''}</div>
          <div class="card-summary">${polarity.summary || ''}</div>
          <div class="breakdown">
            <div class="pill positive">
              Neutral ${polarity.breakdown?.neutral || 0}%
            </div>
            <div class="pill positive">
              Positive ${polarity.breakdown?.positive || 0}%
            </div>
            <div class="pill negative">
              Negative ${polarity.breakdown?.negative || 0}%
            </div>
          </div>
        </div>

        <!-- Echo chamber -->
        <div class="card">
          <div class="card-title">
            Echo Chamber & Reinforcement
          </div>
          <div class="card-headline">${echo.label || ''}</div>
          <div class="card-summary">${echo.summary || ''}</div>
          <div style="font-size: 13px; color: #888; 
                      margin-bottom: 16px;">
            ECHO CHAMBER SIGNAL — 
            ${echo.signal_percentage || 0}%
          </div>
          <div class="breakdown">
            <div class="pill unique">
              Unique Sources ${echo.breakdown?.unique_sources || 0}%
            </div>
            <div class="pill repeated">
              Repeated Themes 
              ${echo.breakdown?.repeated_themes || 0}%
            </div>
          </div>
          <div class="card-title" style="margin-top: 20px;">
            Key Themes
          </div>
          <div class="key-themes">${keyThemesHTML}</div>
        </div>

        <!-- Print summary -->
        <div class="print-card">
          <div class="card-title">Printed Report Preview</div>
          <div class="card-headline">${print.headline || ''}</div>
          <div class="print-lines">
            <div class="print-line">📊 ${print.line1 || ''}</div>
            <div class="print-line">💭 ${print.line2 || ''}</div>
            <div class="print-line">🔄 ${print.line3 || ''}</div>
          </div>
          <div class="print-recommendation">
            <strong>Recommendation</strong>
            ${print.recommendation || ''}
          </div>
        </div>
      `;
    }

    // ── Load on page start ────────────────────────────
    loadReport('diverse',
      document.querySelector('.switcher button'));
  </script>
</body>
</html>
