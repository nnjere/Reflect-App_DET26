<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reflect — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a1a;
      --surface:   #222222;
      --border:    rgba(255,255,255,0.07);
      --accent:    #ff7faa;
      --text:      #f0f0f0;
      --muted:     #777;
      --sidebar-w: 216px;
      --toolbar-h: 48px;
    }

    /* Page never scrolls */
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .root {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.25s ease, opacity 0.2s ease;
    }

    .sidebar.collapsed {
      width: 0;
      opacity: 0;
      border-right: none;
    }

    .sidebar-header {
      padding: 18px 14px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
    }

    .sidebar-eyebrow {
      font-size: 9px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .sidebar-project {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 0 16px;
    }

    .sidebar-nav::-webkit-scrollbar { width: 3px; }
    .sidebar-nav::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }

    .nav-group { margin-bottom: 2px; }

    .nav-group-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 14px 3px;
      white-space: nowrap;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 14px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      white-space: nowrap;
      transition: background 0.12s, color 0.12s;
    }

    .nav-btn:hover  { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-btn.active { background: rgba(255,127,170,0.1);  color: var(--accent); font-weight: 500; }

    .nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ── Toolbar ── */
    .toolbar {
      height: var(--toolbar-h);
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
    }

    .collapse-btn {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }

    .collapse-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }

    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    .screen-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }

    .screen-badge {
      font-size: 10px;
      font-weight: 500;
      background: rgba(255,127,170,0.14);
      color: var(--accent);
      border-radius: 4px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    .toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-btn {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.12s, border-color 0.12s;
      white-space: nowrap;
    }

    .toolbar-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.18); }

    /* ── Canvas — fills remaining height, never scrolls ── */
    .canvas {
      flex: 1;
      overflow: hidden;         /* outer page does NOT scroll */
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    /* ── Phone wrap ── */
    .phone-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /*
      Phone bezel sized to give exactly 393×844px interior
      matching the Figma screen designs precisely.
      padding: 6px each side → bezel = 393+12=405px wide, 844+12=856px tall
    */
    .phone-bezel {
      width: 405px;
      height: 856px;
      border-radius: 50px;
      background: #0e0e0e;
      padding: 6px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 0 0 8px #1c1c1c,
        0 28px 70px rgba(0,0,0,0.75);
      position: relative;
      flex-shrink: 0;
    }

    /* Dynamic island */
    .phone-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 30px;
      background: #0e0e0e;
      border-radius: 20px;
      z-index: 10;
      pointer-events: none;
    }

    .phone-screen {
      width: 100%;   /* = 393px exactly */
      height: 100%;  /* = 844px exactly */
      border-radius: 45px;
      overflow: hidden;
      background: #fef7e5;
      position: relative;
    }

    /* iframe fills phone screen — scroll happens inside, never outside */
    .phone-screen iframe {
      width: 393px;   /* exact design width */
      height: 844px;  /* exact design height */
      border: none;
      display: block;
      overflow: hidden;
    }

    .canvas-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      text-align: center;
    }

    /* Scale the whole phone down on smaller screens */
    @media (max-height: 920px) {
      .phone-wrap { transform: scale(0.88); transform-origin: center center; }
    }
    @media (max-height: 800px) {
      .phone-wrap { transform: scale(0.76); transform-origin: center center; }
    }
    @media (max-height: 700px) {
      .phone-wrap { transform: scale(0.65); transform-origin: center center; }
    }
  </style>
<style>body{padding:0!important;margin:0!important;display:block!important;min-height:100%!important;}.page,.phone{border-radius:0!important;box-shadow:none!important;width:393px!important;height:844px!important;}::-webkit-scrollbar{display:none!important;}*{scrollbar-width:none!important;}</style></head>
<body>
<div class="root">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <p class="sidebar-eyebrow">Prototype</p>
      <p class="sidebar-project">Digital Patterns App</p>
    </div>

    <nav class="sidebar-nav">

      <div class="nav-group">
        <p class="nav-group-label">Entry</p>
        <button class="nav-btn active"
                data-src="user-upload.html"
                data-label="Upload / Onboarding"
                onclick="loadScreen(this)">
          <span class="nav-dot" style="background:#ff7faa"></span>
          Upload / Onboarding
        </button>
        <button class="nav-btn"
                data-src="user-dashboard.html"
                data-label="Dashboard"
                onclick="loadScreen(this)">
          <span class="nav-dot" style="background:#fdba74"></span>
          Dashboard
        </button>
        <button class="nav-btn"
                data-src="user-ecosystem.html"
                data-label="Ecosystem"
                onclick="loadScreen(this)">
          <span class="nav-dot" style="background:#b197fc"></span>
          Ecosystem
        </button>
      </div>

      <div class="nav-group">
        <p class="nav-group-label">Feed Insights</p>
        <button class="nav-btn"
                data-src="user-content-patterns.html"
                data-label="Content Patterns"
                onclick="loadScreen(this)">
          <span class="nav-dot" style="background:#93c5fd"></span>
          Content Patterns
        </button>
        <button class="nav-btn"
                data-src="user-emotional-tone.html"
                data-label="Emotional Tone"
                onclick="loadScreen(this)">
          <span class="nav-dot" style="background:#85b87d"></span>
          Emotional Tone
        </button>
        <button class="nav-btn"
                data-src="user-echo-chamber.html"
                data-label="Echo Chamber"
                onclick="loadScreen(this)">
          <span class="nav-dot" style="background:#ff7d45"></span>
          Echo Chamber
        </button>
      </div>

      <div class="nav-group">
        <p class="nav-group-label">Group Ecosystem</p>
        <button class="nav-btn"
                data-src="group-overview.html"
                data-label="Group Overview"
                onclick="loadScreen(this)">
          <span class="nav-dot" style="background:#fca5a5"></span>
          Group Overview
        </button>
        <button class="nav-btn"
                data-src="group-entertainment.html"
                data-label="Group — Entertainment"
                onclick="loadScreen(this)">
          <span class="nav-dot" style="background:#fdba74"></span>
          Group — Entertainment
        </button>
        <button class="nav-btn"
                data-src="group-wellness.html"
                data-label="Group — Wellness"
                onclick="loadScreen(this)">
          <span class="nav-dot" style="background:#6ee7b7"></span>
          Group — Wellness
        </button>
        <button class="nav-btn"
                data-src="group-user.html"
                data-label="Group — User Detail"
                onclick="loadScreen(this)">
          <span class="nav-dot" style="background:#a5b4fc"></span>
          Group — User Detail
        </button>
      </div>

    </nav>
  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="collapse-btn" onclick="toggleSidebar()" title="Toggle sidebar">
        <svg width="14" height="12" viewBox="0 0 14 12" fill="none">
          <rect y="0"   width="14" height="1.5" rx="0.75" fill="currentColor"/>
          <rect y="5"   width="14" height="1.5" rx="0.75" fill="currentColor"/>
          <rect y="10"  width="14" height="1.5" rx="0.75" fill="currentColor"/>
        </svg>
      </button>

      <div class="toolbar-divider"></div>

      <span class="screen-name" id="screen-label">Upload / Onboarding</span>
      <span class="screen-badge">11 screens</span>

      <div class="toolbar-right">
        <a class="toolbar-btn" id="standalone-link" href="user-upload.html" target="_blank">
          ↗ Open standalone
        </a>
      </div>
    </div>

    <!-- Canvas — static, scroll only inside the phone iframe -->
    <div class="canvas">
      <div class="phone-wrap">
        <div class="phone-bezel">
          <div class="phone-island"></div>
          <div class="phone-screen">
            <iframe id="proto-frame" src="user-upload.html" title="Prototype"></iframe>
          </div>
        </div>
        <p class="canvas-hint">Scroll inside the phone · or pick a screen from the sidebar</p>
      </div>
    </div>

  </div>
</div>

<script>
  const frame      = document.getElementById('proto-frame');
  const label      = document.getElementById('screen-label');
  const standalone = document.getElementById('standalone-link');
  const sidebar    = document.getElementById('sidebar');
  let open = true;

  function toggleSidebar() {
    open = !open;
    sidebar.classList.toggle('collapsed', !open);
  }

  function loadScreen(btn) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Hide iframe during load to prevent flash of wrong size
    frame.style.opacity = '0';
    frame.src         = btn.dataset.src;
    label.textContent = btn.dataset.label;
    standalone.href   = btn.dataset.src;
  }

  // Sync active state when user navigates inside the iframe
  frame.addEventListener('load', () => {
    // ── Inject CSS to fix body padding, background and hide scrollbars ──
    try {
      const style = frame.contentDocument.createElement('style');
      style.textContent = `
        /* Remove the outer phone-shell body styles — iframe is the shell */
        body {
          padding: 0 !important;
          margin: 0 !important;
          background: #fef7e5 !important;
          min-height: 100% !important;
          display: block !important;
          align-items: unset !important;
          justify-content: unset !important;
        }
        /* Make .page / .phone fill the iframe exactly */
        .page, .phone {
          border-radius: 0 !important;
          box-shadow: none !important;
          width: 393px !important;
          height: 844px !important;
        }
        /* Hide all scrollbars inside the iframe */
        ::-webkit-scrollbar { display: none !important; }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }

        /* ── Status bar ── */
        #reflect-status-bar {
          position: fixed;
          top: 0; left: 0; right: 0;
          height: 58px;
          background: #f5ead6;
          z-index: 9999;
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          padding: 0 28px 12px;
          pointer-events: none;
        }

        #reflect-status-bar .sb-time {
          font-family: 'Inter', -apple-system, sans-serif;
          font-size: 15px;
          font-weight: 600;
          color: #0a0a0a;
          letter-spacing: -0.3px;
          line-height: 1;
        }

        #reflect-status-bar .sb-icons {
          display: flex;
          align-items: center;
          gap: 6px;
        }

        /* Scale content down 10% to prevent overflow, keep small text readable */
        .phone-scroll, .page-scroll {
          zoom: 0.92 !important;
        }
        /* Restore smallest text sizes that shouldn't shrink */
        .nav-label, .stat-label, .card-overline,
        .howto-step, .step-num, .persona-desc,
        .section-label, .signal-desc, .tone-desc,
        .bullet-text, .legend-text-sub {
          font-size: 12px !important;
          zoom: 1.087 !important; /* compensate: 1/0.92 */
        }
        .page .page-scroll,
        .phone .phone-scroll {
          padding-top: 58px !important;
        }

        /* Also push topbar/header sections down */
        .topbar, .header {
          padding-top: 66px !important;
        }
      `;
      frame.contentDocument.head.appendChild(style);

      // ── Inject status bar HTML ──
      const bar = frame.contentDocument.createElement('div');
      bar.id = 'reflect-status-bar';
      bar.innerHTML = `
        <span class="sb-time" id="sb-clock">9:41</span>
        <div class="sb-icons">
          <!-- Signal bars -->
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
            <rect x="0"  y="8" width="3" height="4" rx="0.75" fill="#0a0a0a"/>
            <rect x="4.5" y="5.5" width="3" height="6.5" rx="0.75" fill="#0a0a0a"/>
            <rect x="9"  y="3" width="3" height="9" rx="0.75" fill="#0a0a0a"/>
            <rect x="13.5" y="0" width="3" height="12" rx="0.75" fill="#0a0a0a"/>
          </svg>
          <!-- Wifi -->
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <path d="M8 9.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z" fill="#0a0a0a"/>
            <path d="M3.5 6.2A6.48 6.48 0 0 1 8 4.5c1.7 0 3.25.65 4.5 1.7" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" fill="none"/>
            <path d="M1 3.5A10.45 10.45 0 0 1 8 1c2.7 0 5.15 1.02 7 2.68" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" fill="none"/>
          </svg>
          <!-- Battery -->
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
            <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#0a0a0a" stroke-opacity="0.35"/>
            <rect x="2" y="2" width="16" height="8" rx="2" fill="#0a0a0a"/>
            <path d="M23 4v4a2 2 0 0 0 0-4z" fill="#0a0a0a" fill-opacity="0.4"/>
          </svg>
        </div>`;
      frame.contentDocument.body.insertBefore(bar, frame.contentDocument.body.firstChild);

      // Live clock
      function updateClock() {
        const now = new Date();
        const h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        const el = frame.contentDocument.getElementById('sb-clock');
        if (el) el.textContent = `${h12}:${m}`;
      }
      updateClock();
      setInterval(updateClock, 30000);

      // Fade in now that layout is correct
      frame.style.transition = 'opacity 0.15s ease';
      frame.style.opacity    = '1';

    } catch(e) {
      frame.style.opacity = '1'; // always show even on error
    }

    // ── Sync sidebar active state ──
    try {
      const src = frame.contentWindow.location.href.split('/').pop().split('?')[0];
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const match = btn.dataset.src === src;
        btn.classList.toggle('active', match);
        if (match) {
          label.textContent = btn.dataset.label;
          standalone.href   = src;
        }
      });
    } catch(e) {}
  });
</script>
</body>
</html>
